<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem internet · Manutenção</title>
  <style>
    :root { --bg: #f4f6f8; --text: #141a22; --muted: #545e6b; --accent: #1f5aa6; --on-accent: #fff; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
    main { max-width: 22rem; }
    h1 { font-size: 1.375rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    button { height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent);
             font: 600 1rem/1 inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="64" height="64" style="border-radius: 12px">
    <h1>Sem internet</h1>
    <p>Esta tela precisa de conexão. Vá para um lugar com sinal ou Wi-Fi e tente de novo. O modo offline completo chega numa próxima versão.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
